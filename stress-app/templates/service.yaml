apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name | lower }}-service
spec:
  type: {{ .Values.service.type | default "ClusterIP" }}
  selector:
    app: {{ .Release.Name | lower }}
  ports:
    - protocol: TCP
      port: {{ .Values.service.port | default 5001 }}
      targetPort: {{ .Values.container.port.containerPort }}
