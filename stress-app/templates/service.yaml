apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name | lower }}-service
  labels:
    {{- include "stress-app.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type | default "ClusterIP" }}
  selector:
    {{- include "stress-app.labels" . | nindent 4 }}
  ports:
    - protocol: TCP
      port: {{ .Values.service.port | default 5001 }}
      targetPort: {{ .Values.container.port.containerPort }}