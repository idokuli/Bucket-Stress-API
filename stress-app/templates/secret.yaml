apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.env.awsCred.secretName }}
  labels:
    {{- include "stress-app.labels" . | nindent 4 }}
type: Opaque
data:
  AWS_ACCESS_KEY_ID: {{ .Values.AWS_ACCESS_KEY_ID | b64enc | quote }}
  AWS_SECRET_ACCESS_KEY: {{ .Values.AWS_SECRET_ACCESS_KEY | b64enc | quote }}
  AWS_REGION: {{ .Values.AWS_REGION | b64enc | quote }}
