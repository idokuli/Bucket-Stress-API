{% extends "layout.html" %}

{% block content %}
<div class="min-h-screen p-6">
    <div class="max-w-5xl mx-auto">
        <div class="glass p-8 rounded-2xl mb-6">
            <div class="flex items-center justify-between mb-6">
                <div class="flex items-center gap-4">
                    <div id="status-icon" class="p-3 bg-blue-500/20 rounded-xl">
                        <i data-lucide="loader-2" class="w-8 h-8 text-blue-400 animate-spin"></i>
                    </div>
                    <div>
                        <h1 class="text-2xl font-bold uppercase tracking-wider">Terraform {{ action }}</h1>
                        <p id="status-text" class="text-slate-400">
                            Status: Running...
                        </p>
                    </div>
                </div>
                <a href="/infra" class="px-6 py-2 bg-slate-700 hover:bg-slate-600 rounded-lg transition-colors">
                    Return to Infra Hub
                </a>
            </div>

            <h3 class="text-slate-400 font-semibold mb-2">Live Terminal Output:</h3>
            <div class="relative">
                <pre id="output-log"
                    class="bg-slate-900 border border-slate-700 p-6 rounded-lg text-xs font-mono overflow-x-auto whitespace-pre-wrap leading-relaxed min-h-[400px] max-h-[70vh]"></pre>
                <div id="scroll-anchor"></div>
            </div>
        </div>
    </div>
</div>

<script>
    const outputLog = document.getElementById('output-log');
    const statusText = document.getElementById('status-text');
    const statusIcon = document.getElementById('status-icon');

    async function streamOutput() {
        const response = await fetch('/infra/stream/{{ action }}');
        const reader = response.body.getReader();
        const decoder = new TextDecoder();

        let fullOutput = '';
        let hasError = false;

        try {
            while (true) {
                const { done, value } = await reader.read();
                if (done) break;

                const chunk = decoder.decode(value, { stream: true });
                fullOutput += chunk;
                outputLog.textContent = fullOutput;

                // Auto-scroll to bottom
                outputLog.scrollTop = outputLog.scrollHeight;

                if (fullOutput.includes('[Process exited with code') && !fullOutput.includes('exited with code 0')) {
                    hasError = true;
                }
            }

            // Finished
            statusText.textContent = hasError ? 'Status: Completed with Errors' : 'Status: Success';
            statusIcon.className = hasError ? 'p-3 bg-red-500/20 rounded-xl' : 'p-3 bg-emerald-500/20 rounded-xl';
            statusIcon.innerHTML = hasError
                ? '<i data-lucide="alert-circle" class="w-8 h-8 text-red-400"></i>'
                : '<i data-lucide="check-circle" class="w-8 h-8 text-emerald-400"></i>';
            lucide.createIcons();

        } catch (error) {
            outputLog.textContent += '\n\n[Frontend Error]: ' + error.message;
            statusText.textContent = 'Status: Stream Broken';
            statusIcon.className = 'p-3 bg-red-500/20 rounded-xl';
            statusIcon.innerHTML = '<i data-lucide="alert-circle" class="w-8 h-8 text-red-400"></i>';
            lucide.createIcons();
        }
    }

    // Start streaming on load
    streamOutput();
</script>
{% endblock %}
